<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Four primitives on a descending size ramp: reads as a halftone gradient
       at 16px, resolves into circle / hexagon / triangle / square when bigger.
       Which is more or less the whole pitch of the app. -->
  <rect width="32" height="32" rx="7" fill="#0b0b0a"/>
  <g fill="#ffb000">
    <circle cx="9" cy="9" r="7.2"/>
    <path d="M23 3 L28.2 6 L28.2 12 L23 15 L17.8 12 L17.8 6 Z"/>
    <path d="M9 17.6 L13.68 25.7 L4.32 25.7 Z"/>
    <rect x="20" y="20" width="6" height="6" rx="0.6"/>
  </g>
</svg>
